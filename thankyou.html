<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | PPRX Events Management Services</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top, rgba(0, 102, 255, 0.08), transparent 30%),
        linear-gradient(180deg, #070d18 0%, #08111d 100%);
      color: #ffffff;
    }

    .thank-you-box {
      width: 100%;
      max-width: 640px;
      text-align: center;
      padding: 44px 30px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 16px 40px rgba(0,0,0,0.28);
    }

    .check {
      font-size: 52px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 14px;
    }

    p {
      font-size: 17px;
      line-height: 1.8;
      color: #dbe5f4;
      margin-bottom: 26px;
    }

    a {
      display: inline-block;
      padding: 14px 26px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      background: linear-gradient(90deg, #ff8a00, #ffb347);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(255, 138, 0, 0.30);
    }
  </style>
</head>
<body>
  <div class="thank-you-box">
    <div class="check">✅</div>
    <h1>Thank You!</h1>
    <p>
      Your inquiry has been successfully sent to PPRX Events Management Services.
      Our team will get back to you as soon as possible.
    </p>
    <a href="index.html">Back to Home</a>
  </div>
</body>
</html>
