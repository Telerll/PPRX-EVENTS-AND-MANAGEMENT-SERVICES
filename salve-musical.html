<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SALVE Musical | PPRX</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #070d18, #08111d);
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 8px;
    }

    p {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 30px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .gallery img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      flex-direction: column;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 75vh;
      border-radius: 10px;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 40px;
      cursor: pointer;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 40px;
      color: white;
      cursor: pointer;
      padding: 10px;
    }

    .prev { left: 20px; }
    .next { right: 20px; }

    .counter {
      margin-top: 10px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: orange;
      text-decoration: none;
    }
  </style>
</head>
<body>

<h1>SALVE Musical</h1>
<p>Concert & Musical Production handled by PPRX</p>

<div class="gallery">
  <img src="salve1.jpg">
  <img src="salve2.jpg">
  <img src="salve3.jpg">
  <img src="salve4.jpg">
  <img src="salve5.jpg">
</div>

<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLightbox()">&times;</span>

  <span class="nav-btn prev" onclick="prevImage()">❮</span>
  <img id="lightbox-img">
  <span class="nav-btn next" onclick="nextImage()">❯</span>

  <div class="counter" id="counter"></div>
</div>

<a href="index.html" class="back">← Back to Home</a>

<script>
  const images = document.querySelectorAll('.gallery img');
  let currentIndex = 0;

  images.forEach((img, index) => {
    img.addEventListener('click', () => {
      currentIndex = index;
      showImage();
      document.getElementById("lightbox").classList.add("active");
    });
  });

  function showImage() {
    document.getElementById("lightbox-img").src = images[currentIndex].src;
    document.getElementById("counter").textContent =
      (currentIndex + 1) + " / " + images.length;
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % images.length;
    showImage();
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    showImage();
  }

  function closeLightbox() {
    document.getElementById("lightbox").classList.remove("active");
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") nextImage();
    if (e.key === "ArrowLeft") prevImage();
    if (e.key === "Escape") closeLightbox();
  });
</script>

</body>
</html>
