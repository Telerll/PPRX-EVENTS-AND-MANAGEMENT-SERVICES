<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SALVE Musical | PPRX</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #070d18, #08111d);
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 8px;
    }

    p {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 30px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .gallery img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 80vh;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 40px;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: orange;
      text-decoration: none;
    }
  </style>
</head>
<body>

<h1>SALVE Musical</h1>
<p>Concert & Musical Production handled by PPRX</p>

<div class="gallery">
  <img src="salve1.jpg" onclick="openLightbox(this.src)">
  <img src="salve2.jpg" onclick="openLightbox(this.src)">
  <img src="salve3.jpg" onclick="openLightbox(this.src)">
  <img src="salve4.jpg" onclick="openLightbox(this.src)">
  <img src="salve5.jpg" onclick="openLightbox(this.src)">
</div>

<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLightbox()">&times;</span>
  <img id="lightbox-img">
</div>

<a href="index.html" class="back">← Back to Home</a>

<script>
  function openLightbox(src) {
    document.getElementById("lightbox-img").src = src;
    document.getElementById("lightbox").classList.add("active");
  }

  function closeLightbox() {
    document.getElementById("lightbox").classList.remove("active");
  }
</script>

</body>
</html>
