<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Blue Hero Sample</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;

  background: linear-gradient(180deg, #000000, #0f2027);
}

/* HERO WRAP */
.hero-wrap {
  width: 100%;
  max-width: 900px;
  padding: 20px;
}

/* HERO BOX (BLUISH GLASS) */
.hero-box {
  position: relative;
  background:
    linear-gradient(135deg, rgba(20,25,40,0.65), rgba(10,15,30,0.55));

  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 28px;
  padding: 40px;

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  box-shadow:
    0 10px 40px rgba(0,0,0,0.5),
    0 0 30px rgba(0,150,255,0.15);

  overflow: hidden;
}

/* GLOSS REFLECTION */
.hero-box::before {
  content: "";
  position: absolute;
  top: 0;
  left: -120%;
  width: 60%;
  height: 100%;

  background: linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.25),
    transparent
  );

  transform: skewX(-25deg);
  transition: 0.8s;
}

.hero-box:hover::before {
  left: 130%;
}

/* GLOW BORDER */
.hero-box::after {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: 28px;
  padding: 1px;

  background: linear-gradient(
    120deg,
    transparent,
    rgba(0,150,255,0.8),
    rgba(0,200,255,0.8),
    transparent
  );

  background-size: 300% 300%;
  animation: glow 6s linear infinite;

  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
}

@keyframes glow {
  0% { background-position: 0% 50%; }
  100% { background-position: 300% 50%; }
}

/* CONTENT */
.hero-top {
  display: flex;
  align-items: center;
  gap: 16px;
}

.hero-logo {
  width: 120px;
}

.hero-right h1 {
  font-size: 50px;
  color: white;

  text-shadow:
    0 0 6px rgba(0,200,255,0.9),
    0 0 14px rgba(0,150,255,0.7),
    0 0 28px rgba(0,150,255,0.4);
}

.hero-right h2 {
  color: #6bdcff;
  font-size: 22px;
}

.hero-text {
  margin-top: 20px;
  color: #ccc;
}

.btn {
  margin-top: 20px;
  padding: 12px 24px;
  border-radius: 50px;
  display: inline-block;
  background: linear-gradient(90deg, #00aaff, #00ddff);
  color: white;
  font-weight: bold;
  text-decoration: none;
}
</style>

</head>
<body>

<div class="hero-wrap">
  <div class="hero-box">

    <div class="hero-top">
      <img src="logo1.png" class="hero-logo">

      <div class="hero-right">
        <h1>PPRX</h1>
        <h2>EVENTS MANAGEMENT</h2>
      </div>
    </div>

    <p class="hero-text">
      Premium event solutions with modern glass UI design and bluish glow theme.
    </p>

    <a href="#" class="btn">Book Now</a>

  </div>
</div>

</body>
</html>
