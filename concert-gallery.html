<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PPRX Concert & Musical Events</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    :root {
      --bg-1: #070d18;
      --bg-2: #08111d;
      --text: #ffffff;
      --muted: #cbd5e1;
      --line: rgba(255,255,255,0.08);
      --orange-1: #ff8a00;
      --orange-2: #ffb347;
    }

    body {
      background:
        radial-gradient(circle at top, rgba(0, 102, 255, 0.08), transparent 30%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--text);
      padding: 20px;
      line-height: 1.6;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 30px;
    }

    p {
      text-align: center;
      margin-bottom: 30px;
      color: var(--muted);
    }

    .event-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1180px;
      margin: 0 auto;
    }

    .event-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.03));
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid var(--line);
      box-shadow: 0 10px 24px rgba(0,0,0,0.22);
    }

    .event-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 28px rgba(0,0,0,0.35);
      border-color: rgba(255,179,71,0.28);
    }

    .event-card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .event-card:hover img {
      transform: scale(1.04);
    }

    .event-title {
      padding: 14px 12px;
      text-align: center;
      font-weight: bold;
      color: #fff;
    }

    .coming-soon {
      opacity: 0.72;
      cursor: default;
    }

    .coming-soon:hover {
      transform: none;
      box-shadow: 0 10px 24px rgba(0,0,0,0.22);
      border-color: var(--line);
    }

    .coming-soon:hover img {
      transform: none;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 12px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
    }

    .close,
    .prev,
    .next {
      position: absolute;
      color: #fff;
      font-size: 40px;
      cursor: pointer;
      user-select: none;
      z-index: 10000;
    }

    .close {
      top: 20px;
      right: 30px;
    }

    .prev {
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
    }

    .next {
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
    }

    .counter {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 14px;
      background: rgba(255,255,255,0.08);
      padding: 8px 14px;
      border-radius: 999px;
    }

    .back-btn {
      display: block;
      width: fit-content;
      margin: 40px auto 0;
      padding: 14px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #facc15, #f97316);
      color: #ffffff;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 6px 20px rgba(249,115,22,0.5);
      transition: 0.3s ease;
    }

    .back-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 30px rgba(249,115,22,0.7);
    }

    @media (max-width: 768px) {
      body {
        padding: 16px;
      }

      h1 {
        font-size: 26px;
      }

      p {
        font-size: 14px;
      }

      .event-grid {
        grid-template-columns: 1fr;
      }

      .event-card img {
        height: 200px;
      }

      .close,
      .prev,
      .next {
        font-size: 32px;
      }

      .prev {
        left: 12px;
      }

      .next {
        right: 12px;
      }
    }
  </style>
</head>
<body>

  <h1>Concert & Musical Events</h1>
  <p>Live performances, concerts, and musical productions handled by PPRX</p>

  <div class="event-grid">

    <!-- SALVE Musical -->
    <div class="event-card" onclick="openGallery(['salve1.jpg','salve2.jpg','salve3.jpg'])">
      <img src="salve1.jpg" alt="SALVE Musical">
      <div class="event-title">SALVE Musical</div>
    </div>

    <!-- MAKARA Musical -->
    <div class="event-card" onclick="openGallery(['makara1.jpg','makara2.jpg','makara3.jpg'])">
      <img src="makara1.jpg" alt="MAKARA Musical">
      <div class="event-title">MAKARA Musical</div>
    </div>

    <!-- Coming Soon -->
    <div class="event-card coming-soon">
      <img src="concert2.jpg" alt="Upcoming Concert Event">
      <div class="event-title">Upcoming Event — Coming Soon</div>
    </div>

    <div class="event-card coming-soon">
      <img src="concert3.jpg" alt="Upcoming Concert Event">
      <div class="event-title">Upcoming Event — Coming Soon</div>
    </div>

  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <span class="close" onclick="closeLightbox()">&times;</span>
    <span class="prev" onclick="prevImage(event)">&#10094;</span>
    <img id="lightbox-img" alt="Expanded event image">
    <span class="next" onclick="nextImage(event)">&#10095;</span>
    <div class="counter" id="counter">1 / 3</div>
  </div>

  <a href="index.html#portfolio" class="back-home-btn">← Back to Events Main</a>

  <script>
    let currentImages = [];
    let currentIndex = 0;

    function openGallery(images) {
      currentImages = images;
      currentIndex = 0;
      updateLightbox();
      document.getElementById("lightbox").classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function updateLightbox() {
      document.getElementById("lightbox-img").src = currentImages[currentIndex];
      document.getElementById("counter").textContent =
        (currentIndex + 1) + " / " + currentImages.length;
    }

    function nextImage(e) {
      if (e) e.stopPropagation();
      currentIndex = (currentIndex + 1) % currentImages.length;
      updateLightbox();
    }

    function prevImage(e) {
      if (e) e.stopPropagation();
      currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
      updateLightbox();
    }

    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("active");
      document.body.style.overflow = "";
    }

    document.getElementById("lightbox").addEventListener("click", function(e) {
      if (e.target === this) {
        closeLightbox();
      }
    });

    document.addEventListener("keydown", function(e) {
      const lightbox = document.getElementById("lightbox");
      if (!lightbox.classList.contains("active")) return;

      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowRight") nextImage();
      if (e.key === "ArrowLeft") prevImage();
    });
  </script>

</body>
</html>
