<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PPRX Concert & Musical Events</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #070d18, #08111d);
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 28px;
    }

    p {
      text-align: center;
      margin-bottom: 30px;
      color: #cbd5e1;
    }

    .event-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .event-card {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.3s;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .event-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .event-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .event-title {
      padding: 12px;
      text-align: center;
      font-weight: bold;
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 10px;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 40px;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: orange;
      text-decoration: none;
      font-weight: bold;
    }

  </style>
</head>
<body>

<h1>Concert & Musical Events</h1>
<p>Live performances, concerts, and musical productions handled by PPRX</p>

<div class="event-grid">

  <div class="event-card" onclick="openLightbox('concert1.jpg')">
    <img src="concert1.jpg">
    <div class="event-title">Live Band Night</div>
  </div>

  <div class="event-card" onclick="openLightbox('concert2.jpg')">
    <img src="concert2.jpg">
    <div class="event-title">Music Festival Setup</div>
  </div>

  <div class="event-card" onclick="openLightbox('concert3.jpg')">
    <img src="concert3.jpg">
    <div class="event-title">Stage Production</div>
  </div>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLightbox()">&times;</span>
  <img id="lightbox-img">
</div>

<a href="index.html" class="back">← Back to Home</a>

<script>
  function openLightbox(src) {
    document.getElementById("lightbox-img").src = src;
    document.getElementById("lightbox").classList.add("active");
    document.body.style.overflow = "hidden";
  }

  function closeLightbox() {
    document.getElementById("lightbox").classList.remove("active");
    document.body.style.overflow = "";
  }

  // close when clicking outside
  document.getElementById("lightbox").addEventListener("click", function(e){
    if(e.target === this){
      closeLightbox();
    }
  });
</script>

</body>
</html>
