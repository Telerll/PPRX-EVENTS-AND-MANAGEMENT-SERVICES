<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PPRX Concert & Musical Events</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #070d18, #08111d);
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 28px;
    }

    p {
      text-align: center;
      margin-bottom: 30px;
      color: #cbd5e1;
    }

    .event-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .event-card {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.3s;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .event-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .event-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .event-title {
      padding: 12px;
      text-align: center;
      font-weight: bold;
    }

    .coming-soon {
      opacity: 0.7;
      cursor: default;
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 10px;
    }

    .close,
    .prev,
    .next {
      position: absolute;
      color: #fff;
      font-size: 40px;
      cursor: pointer;
      user-select: none;
    }

    .close {
      top: 20px;
      right: 30px;
    }

    .prev {
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
    }

    .next {
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
    }

    .counter {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 14px;
      background: rgba(255,255,255,0.08);
      padding: 8px 14px;
      border-radius: 999px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: orange;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1>Concert & Musical Events</h1>
<p>Live performances, concerts, and musical productions handled by PPRX</p>

<div class="event-grid">

  <!-- SALVE Musical -->
  <div class="event-card" onclick="openGallery(['salve1.jpg','salve2.jpg','salve3.jpg'])">
    <img src="salve1.jpg" alt="SALVE Musical">
    <div class="event-title">SALVE Musical</div>
  </div>

  <!-- MAKARA Muscal -->
  <div class="event-card" onclick="openGallery(['makara1.jpg','makara2.jpg','makara3.jpg'])">
    <img src="concert1.jpg" alt="Upcoming Concert Event">
    <div class="event-title">MAKARA musical</div>
  </div>

  <!-- Coming Soon 2 -->
  <div class="event-card coming-soon">
    <img src="concert2.jpg" alt="Upcoming Concert Event">
    <div class="event-title">Upcoming Event — Coming Soon</div>
  </div>

  <!-- Coming Soon 3 -->
  <div class="event-card coming-soon">
    <img src="concert3.jpg" alt="Upcoming Concert Event">
    <div class="event-title">Upcoming Event — Coming Soon</div>
  </div>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLightbox()">&times;</span>
  <span class="prev" onclick="prevImage(event)">&#10094;</span>
  <img id="lightbox-img" alt="Expanded event image">
  <span class="next" onclick="nextImage(event)">&#10095;</span>
  <div class="counter" id="counter">1 / 3</div>
</div>

<a href="index.html" class="back">← Back to Home</a>

<script>
  let currentImages = [];
  let currentIndex = 0;

  function openGallery(images) {
    currentImages = images;
    currentIndex = 0;
    updateLightbox();
    document.getElementById("lightbox").classList.add("active");
    document.body.style.overflow = "hidden";
  }

  function updateLightbox() {
    document.getElementById("lightbox-img").src = currentImages[currentIndex];
    document.getElementById("counter").textContent =
      (currentIndex + 1) + " / " + currentImages.length;
  }

  function nextImage(e) {
    if (e) e.stopPropagation();
    currentIndex = (currentIndex + 1) % currentImages.length;
    updateLightbox();
  }

  function prevImage(e) {
    if (e) e.stopPropagation();
    currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
    updateLightbox();
  }

  function closeLightbox() {
    document.getElementById("lightbox").classList.remove("active");
    document.body.style.overflow = "";
  }

  document.getElementById("lightbox").addEventListener("click", function(e) {
    if (e.target === this) {
      closeLightbox();
    }
  });

  document.addEventListener("keydown", function(e) {
    const lightbox = document.getElementById("lightbox");
    if (!lightbox.classList.contains("active")) return;

    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowRight") nextImage();
    if (e.key === "ArrowLeft") prevImage();
  });
</script>

</body>
</html>
